trigger:
  - main

variables:
  imageRepository: 'app1/springboot-tasks'
  dockerRegistryServiceConnection: 'ACR-Service-Connection'
  azureServiceConnection: 'AKS-Service-Connection'
  imageTag: '$(Build.BuildId)'

stages:

- stage: Test
  displayName: Test
  jobs:
  - job: Test
    pool:
      vmImage: ubuntu-latest

    steps:
    - script: ./mvnw test
      displayName: Run tests


- stage: Build
  displayName: Build and Push
  dependsOn: Test
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: Docker@2
      displayName: Build and push image
      inputs:
        command: buildAndPush
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: $(imageRepository)
        dockerfile: $(Build.SourcesDirectory)/Dockerfile
        tags: |
          $(imageTag)


- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  jobs:
  - job: Deploy
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: KubernetesManifest@1
      displayName: Deploy to AKS
      inputs:
        action: deploy
        connectionType: azureResourceManager
        azureSubscriptionConnection: $(azureServiceConnection)
        azureResourceGroup: 'TU-RG'
        kubernetesCluster: 'TU-AKS'
        namespace: default
        manifests: |
          $(Build.SourcesDirectory)/k8s/deployment.yaml
        containers: |
          jld98.azurecr.io/app1/springboot-tasks:$(imageTag)
        rolloutStatusTimeout: '120'